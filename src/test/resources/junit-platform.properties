# Step tanımları ve hook'ların bulunduğu paketler
cucumber.glue=com.enocta.steps,com.enocta.hooks

# Raporlar:
#  - summary  : konsolda koşum özeti (paralel koşumda satırlar karışmasın diye "pretty" yerine)
#  - html     : Cucumber HTML raporu
#  - timeline : senaryoların hangi thread'de ve ne zaman koştuğunu gösteren zaman çizelgesi
cucumber.plugin=summary, html:target/cucumber-reports/cucumber-report.html, timeline:target/cucumber-reports/timeline
cucumber.publish.quiet=true

# Paralel koşum: senaryolar aynı anda en fazla 3 thread'de koşar.
# Her senaryo kendi WebDriver'ını ve kendi ScenarioContext'ini kullanır (PicoContainer).
cucumber.execution.parallel.enabled=true
cucumber.execution.parallel.config.strategy=fixed
cucumber.execution.parallel.config.fixed.parallelism=3
cucumber.execution.parallel.config.fixed.max-pool-size=3
